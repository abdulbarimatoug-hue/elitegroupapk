name: admin_dashboard
description: "Web management dashboard for LY-Elite Tourism Group (مجموعة النخبة للخدمات السياحية)"
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Clean Architecture internal packages
  core_domain:
    path: ../core_domain
  core_data:
    path: ../core_data

  # Riverpod State Management
  flutter_riverpod: ^2.6.1

  # Firebase Suite for Web
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  # UI & Charts
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
