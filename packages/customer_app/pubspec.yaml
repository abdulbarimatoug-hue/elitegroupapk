name: customer_app
description: "Mobile customer application (Android & iOS) for LY-Elite Tourism Group (مجموعة النخبة للخدمات السياحية)"
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Clean Architecture internal packages
  core_domain:
    path: ../core_domain
  core_data:
    path: ../core_data

  # State Management (Riverpod without get_it)
  flutter_riverpod: ^2.6.1

  # Firebase Suite
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.2

  # UI, Fonts & Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Communication & WhatsApp Conversion
  url_launcher: ^6.3.1

  # PDF Generation for Boarding Pass / Trip Summary
  pdf: ^3.11.1
  printing: ^5.13.2

  # Local Persistence for Custom Trip Drafts
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
